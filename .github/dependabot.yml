# Each push to main starts CI, and CI then starts the deploy to beta and pwf.
# The commit messages of Dependabot have [skip ci], so a squash merge of a Dependabot
# pull request starts no workflow and no deploy. CI also does not run on these pull requests.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "[skip ci] deps"
      prefix-development: "[skip ci] deps-dev"
      include: "scope"
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["patch", "minor"]
      react-router:
        applies-to: version-updates
        patterns:
          - "react-router"
          - "@react-router/*"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      navikt:
        applies-to: version-updates
        patterns:
          - "@navikt/*"
      vite-tailwind:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vite-*"
          - "tailwindcss"
          - "@tailwindcss/*"
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "[skip ci] deps"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "[skip ci] deps"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
